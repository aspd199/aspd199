<svg xmlns="http://www.w3.org/2000/svg" width="495" height="180" viewBox="0 0 495 180">
  <rect x="2" y="2" width="491" height="176" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>

  <!-- up-arrow icon -->
  <polygon points="30,46 42,26 54,46" fill="#2F9E44"/>
  <rect x="39" y="46" width="6" height="14" fill="#2F9E44"/>

  <text x="64" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6b21a8">uplink</text>

  <text x="22" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#4c1d95">5</text>
  <text x="74" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#6b21a8">Centuries</text>

  <line x1="190" y1="40" x2="190" y2="150" stroke="#c4b5fd" stroke-width="2"/>

  <text x="210" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4c1d95">Longest Uplink: <tspan font-weight="700">12 Centuries</tspan></text>
  <text x="210" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4c1d95">Aliens Met: <tspan font-weight="700">1,337</tspan></text>
  <text x="210" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4c1d95">Departed: <tspan font-weight="700">November 2026</tspan></text>

  <text x="210" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7e22ce">Keep the signal alive.</text>
</svg>
